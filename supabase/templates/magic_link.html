<h2>Logga in på Settle</h2>
<p>Tryck på länken för att logga in:</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email">Logga in</a></p>
<p>Eller skriv in den här koden i appen:</p>
<p style="font-size:28px;font-weight:700;letter-spacing:4px">{{ .Token }}</p>
<p>Om du inte bad om att logga in kan du strunta i det här mejlet.</p>
